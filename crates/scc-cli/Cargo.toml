[package]
name = "scc-cli"
version = "0.4.0-alpha.1"
license = "Apache-2.0"
edition = "2021"

[[bin]]
name = "scc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
scc-core = { path = "../scc-core" }
scc-proposal = { path = "../scc-proposal" }
scc-analysis = { path = "../scc-analysis" }
scc-lowering = { path = "../scc-lowering" }
scc-execution = { path = "../scc-execution" }
scc-geometry = { path = "../scc-geometry" }
scc-engineering = { path = "../scc-engineering" }
scc-drawing = { path = "../scc-drawing" }
scc-spatial = { path = "../scc-spatial" }
scc-projection = { path = "../scc-projection" }
scc-visibility = { path = "../scc-visibility" }
scc-projection-consistency = { path = "../scc-projection-consistency" }
scc-dsl = { path = "../scc-dsl" }
scc-tools = { path = "../scc-tools" }
scc-project = { path = "../scc-project" }
scc-manufacturing = { path = "../scc-manufacturing" }
scc-cad-backend = { path = "../scc-cad-backend" }
thiserror = "1"
tempfile = "3"
