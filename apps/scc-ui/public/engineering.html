<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AICAD Engineering Workbench</title>
    <link rel="stylesheet" href="/css/engineering.css" />
  </head>
  <body>
    <header class="wb-header">
      <div class="wb-brand"><span class="wb-eyebrow">AICAD · ENGINEERING</span><h1 data-i18n="AICAD Engineering Workbench">AICAD 工程工作台</h1></div>
      <nav class="wb-toolbar" aria-label="Engineering Workbench">
        <button id="project-new" data-i18n="New">新建</button>
        <button id="project-open" data-i18n="Open">打开</button>
        <button id="project-save" data-i18n="Save">保存</button>
        <button id="model-manager-open" data-i18n="Provider settings">AI 模型管理</button>
        <button id="export-svg" data-i18n="Export SVG" disabled>导出 SVG</button>
        <button id="export-dxf" data-i18n="Export DXF" disabled>导出 DXF</button>
        <button id="project-export-step" data-i18n="Export STEP">导出 STEP</button>
        <label class="wb-language"><span>Language</span><select id="language-select" aria-label="Language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
      </nav>
      <input id="project-file" type="file" accept=".aicad.json,application/json" hidden />
      <div class="wb-info"><span id="project-state">未保存</span><span id="model-status"></span><span id="drawing-status" role="status"></span><span id="status" role="status"></span></div>
      <details class="wb-advanced"><summary>DSL · Advanced</summary><button id="load-fixture" data-i18n="Load mounting plate fixture">载入内置安装板</button><textarea id="dsl-input" rows="3" data-i18n-placeholder="Or paste AICAD DSL and apply…" placeholder="或粘贴 AICAD DSL 并应用…"></textarea><button id="dsl-apply" data-i18n="Apply DSL">应用 DSL</button></details>
    </header>
    <section id="intent-workflow" class="wb-intent-panel" hidden></section>
    <section id="cad-skill-status" class="wb-intent-panel wb-cad-skills" aria-live="polite" hidden></section>
    <main id="workbench-root" class="wb-root"></main>
    <dialog id="model-manager-dialog" class="model-dialog" aria-label="AI 模型管理"></dialog>
    <script type="module" src="/js/engineering-page.js"></script>
  </body>
</html>
